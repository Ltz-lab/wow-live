[package]
name = "wow-rotation"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Hekili-style next-press suggestions for retail WoW, driven by the live combat log"

[[bin]]
name = "wow-rotation"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
