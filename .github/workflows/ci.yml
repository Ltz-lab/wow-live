name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      # -race because the feed hub is shared between the reader, the socket
      # writers and the HTTP handlers
      - name: test
        run: go test -race ./...

  rotation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rotation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test --release
